name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          set -o pipefail
          npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tee -a build.log

      - name: Type check (report only)
        continue-on-error: true
        run: |
          npx tsc --noEmit > typecheck.txt 2>&1 && echo "TypeScript: OK (no errors)" >> typecheck.txt || echo "TypeScript: errors above" >> typecheck.txt
          tail -n 40 typecheck.txt

      - name: Build web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a build.log

      - name: Create Android project
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee -a build.log
          python3 ci/patch-android.py android 2>&1 | tee -a build.log
          npx cap sync android 2>&1 | tee -a build.log

      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#1E5B45' --iconBackgroundColorDark '#1E5B45' --splashBackgroundColor '#F4F6F5' --splashBackgroundColorDark '#0C1310'

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            KS=/tmp/release.keystore; PASS="$KEYSTORE_PASSWORD"
          else
            KS=ci/release.keystore; PASS=deepboost-life-2026
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --ks-key-alias deepboost --key-pass "pass:$PASS" --out DeepBoost-Life.apk aligned.apk
          "$BT/apksigner" verify DeepBoost-Life.apk
          ls -lh DeepBoost-Life.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DeepBoost Life 1.0.${{ github.run_number }}
          body: "Install: download DeepBoost-Life.apk below on your Android phone and open it."
          files: |
            DeepBoost-Life.apk
            typecheck.txt
          make_latest: true

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} failed for commit ${{ github.sha }}."
            echo
            echo '```'
            tail -n 120 build.log 2>/dev/null | grep -v '^\s*$' | tail -n 100 || echo "no log"
            echo '```'
          } > report.md
          gh issue create --title "APK build ${{ github.run_number }} failed" --body-file report.md || true
