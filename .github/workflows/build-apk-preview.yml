name: Build APK Preview

on:
  push:
    branches: [codex/additive-money-phase1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Generate app icons
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#1E5B45' --iconBackgroundColorDark '#1E5B45' --splashBackgroundColor '#F4F6F5' --splashBackgroundColorDark '#0C1310'
      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            KS=/tmp/release.keystore
            PASS="$KEYSTORE_PASSWORD"
          else
            KS=ci/release.keystore
            PASS=deepboost-life-2026
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-alias deepboost --key-pass "pass:$PASS" --out DeepBoost-Life-preview.apk aligned.apk
          "$BT/apksigner" verify DeepBoost-Life-preview.apk
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepBoost-Life-preview-${{ github.run_number }}
          path: DeepBoost-Life-preview.apk
          if-no-files-found: error
          retention-days: 14

# Preview builds are isolated from the production release workflow.
